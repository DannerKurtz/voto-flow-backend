name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: voto_flow
          POSTGRES_USER: voto_flow
          POSTGRES_PASSWORD: voto_flow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voto_flow -d voto_flow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://voto_flow:voto_flow@localhost:5432/voto_flow
      FRONTEND_ORIGIN: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
